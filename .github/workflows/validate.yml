name: Validate MUSICTOOL DAW

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Check whitespace and conflict markers
        run: git diff --check
