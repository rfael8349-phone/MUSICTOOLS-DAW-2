<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1d1d2a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a9a"/>
      <stop offset="100%" stop-color="#5a5a6a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d93535"/>
      <stop offset="100%" stop-color="#8a1f1f"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="14" fill="url(#bg)"/>
  <rect x="6" y="6" width="88" height="88" rx="10" fill="none" stroke="#2a2a38" stroke-width="1"/>

  <!-- amp behind -->
  <rect x="70" y="60" width="20" height="22" rx="2" fill="#1a1a24" stroke="#3a3a4c"/>
  <rect x="73" y="63" width="14" height="10" rx="1" fill="#2a2a38"/>
  <circle cx="75" cy="78" r="1.2" fill="#4fe0c4"/>
  <circle cx="80" cy="78" r="1.2" fill="#f0a83a"/>
  <circle cx="85" cy="78" r="1.2" fill="#d93535"/>

  <!-- body / shirt -->
  <ellipse cx="42" cy="80" rx="18" ry="14" fill="url(#shirt)"/>
  <ellipse cx="42" cy="76" rx="16" ry="4" fill="#0a0a0f" opacity="0.3"/>

  <!-- head -->
  <ellipse cx="42" cy="48" rx="20" ry="19" fill="url(#fur)"/>

  <!-- ears -->
  <ellipse cx="26" cy="32" rx="9" ry="11" fill="url(#fur)"/>
  <ellipse cx="26" cy="33" rx="5" ry="7" fill="#c98a9a"/>
  <ellipse cx="58" cy="32" rx="9" ry="11" fill="url(#fur)"/>
  <ellipse cx="58" cy="33" rx="5" ry="7" fill="#c98a9a"/>

  <!-- tired eyes -->
  <ellipse cx="35" cy="47" rx="2.4" ry="2.8" fill="#0a0a0f"/>
  <ellipse cx="49" cy="47" rx="2.4" ry="2.8" fill="#0a0a0f"/>
  <circle cx="35.6" cy="46.3" r="0.8" fill="#e8e6df"/>
  <circle cx="49.6" cy="46.3" r="0.8" fill="#e8e6df"/>

  <!-- bags under eyes -->
  <path d="M32 52 Q35 54 38 52" stroke="#3a3a4c" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M46 52 Q49 54 52 52" stroke="#3a3a4c" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="42" cy="53" rx="2.5" ry="2" fill="#e07a8a"/>

  <!-- sad mouth -->
  <path d="M37 59 Q42 56 47 59" stroke="#0a0a0f" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- cigarette -->
  <rect x="44" y="58" width="9" height="2.2" rx="0.5" fill="#efe6d3" transform="rotate(-15 44 58)"/>
  <circle cx="53" cy="56.5" r="1.3" fill="#f0a83a"/>
  <circle cx="53" cy="56.5" r="2.3" fill="#f0a83a" opacity="0.35"/>

  <!-- guitar body -->
  <ellipse cx="76" cy="82" rx="9" ry="7" fill="#8a5a2a"/>
  <ellipse cx="76" cy="82" rx="6" ry="4.5" fill="#5a3a1a"/>
  <circle cx="76" cy="82" r="1.8" fill="#0a0a0f"/>
  <!-- guitar neck -->
  <rect x="66" y="66" width="2.2" height="14" rx="0.6" fill="#3a2a1a" transform="rotate(-20 66 66)"/>
  <rect x="64.5" y="63" width="3.5" height="3" rx="0.6" fill="#1a1a24"/>

  <!-- strings -->
  <line x1="68" y1="66" x2="80" y2="80" stroke="#efe6d3" stroke-width="0.4" opacity="0.7"/>
  <line x1="69" y1="65" x2="81" y2="79" stroke="#efe6d3" stroke-width="0.4" opacity="0.7"/>
</svg>