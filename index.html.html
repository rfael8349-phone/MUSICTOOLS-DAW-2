<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MUSICTOOL DAW — Winamp Edition</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1a1a;
    font-family: 'Courier New', monospace;
    color: #00ff41;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(#3a3a3a, #1a1a1a);
  }

  /* === Ventana Winamp === */
  .winamp {
    background: linear-gradient(#4a4a4a, #2a2a2a);
    border: 1px solid #000;
    border-top-color: #666;
    border-left-color: #666;
    box-shadow: inset 0 1px 0 #777, 0 2px 4px rgba(0,0,0,0.5);
  }

  /* === Barra de título === */
  .titlebar {
    height: 24px;
    background: linear-gradient(#3a3a3a, #1a1a1a);
    border-bottom: 1px solid #000;
    display: flex;
    align-items: center;
    padding: 0 4px;
    font-size: 11px;
    color: #b0b0b0;
    letter-spacing: 0.5px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  .titlebar .logo {
    color: #00ff41;
    text-shadow: 0 0 4px #00ff41;
    margin-right: 6px;
  }
  .titlebar .spacer { flex: 1; }
  .titlebar .status {
    font-size: 9px;
    color: #888;
    margin-right: 6px;
  }
  .winamp-btn {
    width: 12px; height: 12px;
    background: linear-gradient(#555, #333);
    border: 1px solid #000;
    border-top-color: #777;
    border-left-color: #777;
    margin-left: 2px;
    font-size: 8px;
    color: #ccc;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .winamp-btn:active { border-top-color: #222; border-left-color: #222; }

  /* === Panel LCD (tiempo/BPM) === */
  .lcd {
    background: #000;
    border: 2px inset #222;
    padding: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px;
    font-family: 'Courier New', monospace;
  }
  .lcd-time {
    font-size: 22px;
    color: #00ff41;
    text-shadow: 0 0 6px #00ff41;
    letter-spacing: 2px;
    min-width: 90px;
  }
  .lcd-info {
    font-size: 10px;
    color: #00aa22;
    line-height: 1.4;
  }
  .lcd-info b { color: #00ff41; }

  /* === Controles de transporte === */
  .transport {
    display: flex;
    gap: 3px;
    padding: 0 6px 6px;
    align-items: center;
  }
  .tbtn {
    background: linear-gradient(#666, #3a3a3a);
    border: 1px solid #000;
    border-top-color: #888;
    border-left-color: #888;
    color: #ddd;
    font-size: 14px;
    padding: 4px 8px;
    cursor: pointer;
    min-width: 34px;
    height: 30px;
    font-family: 'Courier New', monospace;
  }
  .tbtn:active {
    border-top-color: #222;
    border-left-color: #222;
    background: linear-gradient(#3a3a3a, #666);
  }
  .tbtn.active {
    background: linear-gradient(#00aa22, #006611);
    color: #fff;
    box-shadow: 0 0 6px #00ff41;
  }
  .bpm-input {
    background: #000;
    border: 2px inset #222;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 4px;
    width: 50px;
    text-align: center;
    text-shadow: 0 0 4px #00ff41;
  }

  /* === Zona principal (timeline + tracks) === */
  .main-area {
    flex: 1;
    display: flex;
    min-height: 0;
    margin: 0 6px;
    border: 1px solid #000;
    border-top-color: #444;
    background: #0a0a0a;
  }

  /* === Lista de pistas === */
  .tracks-panel {
    width: 90px;
    background: #1a1a1a;
    border-right: 1px solid #000;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .tracks-panel .header {
    height: 18px;
    background: linear-gradient(#333, #1a1a1a);
    font-size: 9px;
    color: #888;
    display: flex;
    align-items: center;
    padding: 0 4px;
    border-bottom: 1px solid #000;
  }
  .track-item {
    height: 40px;
    border-bottom: 1px solid #000;
    padding: 3px;
    font-size: 9px;
    cursor: pointer;
  }
  .track-item.selected {
    background: #0a2a0a;
    box-shadow: inset 0 0 4px #00ff41;
  }
  .track-item .tname {
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .track-item .tbtns {
    display: flex;
    gap: 2px;
  }
  .track-item .tbtns button {
    background: #333;
    border: 1px solid #000;
    color: #888;
    font-size: 8px;
    padding: 1px 3px;
    font-family: inherit;
    cursor: pointer;
  }
  .track-item .tbtns button.on {
    background: #00aa22;
    color: #fff;
  }
  .track-item .tbtns button.mute.on { background: #aa2222; }
  .track-item .tbtns button.solo.on { background: #aaaa22; color: #000; }

  .add-btns {
    padding: 3px;
    display: flex;
    gap: 2px;
    border-top: 1px solid #000;
  }
  .add-btns button {
    flex: 1;
    background: #333;
    border: 1px solid #000;
    border-top-color: #666;
    color: #ccc;
    font-size: 9px;
    padding: 4px 2px;
    cursor: pointer;
    font-family: inherit;
  }
  .add-btns button:active { background: #222; }

  /* === Timeline === */
  .timeline-panel {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #0a0a0a;
    min-width: 0;
  }
  .timeline-inner {
    position: relative;
    min-height: 100%;
  }
  .ruler {
    height: 18px;
    background: linear-gradient(#1a1a1a, #000);
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    z-index: 5;
    cursor: pointer;
  }
  .ruler-mark {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid #333;
    font-size: 8px;
    color: #666;
    padding-left: 2px;
  }
  .track-lane {
    height: 40px;
    border-bottom: 1px solid #111;
    position: relative;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent 39px, #111 39px, #111 40px);
  }
  .track-lane.selected {
    background-color: #050f05;
  }
  .clip {
    position: absolute;
    top: 3px;
    bottom: 3px;
    background: linear-gradient(#00aa22, #005511);
    border: 1px solid #00ff41;
    color: #fff;
    font-size: 9px;
    padding: 2px 3px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,255,65,0.5);
    white-space: nowrap;
  }
  .clip.midi {
    background: linear-gradient(#aa8822, #553300);
    border-color: #ffcc00;
    box-shadow: 0 0 4px rgba(255,204,0,0.5);
  }
  .playhead {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #00ff41;
    box-shadow: 0 0 4px #00ff41;
    pointer-events: none;
    z-index: 10;
  }

  /* === Panel inferior (acciones) === */
  .action-bar {
    display: flex;
    gap: 3px;
    padding: 6px;
    background: linear-gradient(#2a2a2a, #1a1a1a);
    border-top: 1px solid #000;
  }
  .action-bar button {
    flex: 1;
    background: linear-gradient(#555, #333);
    border: 1px solid #000;
    border-top-color: #777;
    color: #ddd;
    font-size: 10px;
    padding: 6px 2px;
    cursor: pointer;
    font-family: inherit;
  }
  .action-bar button:active {
    background: linear-gradient(#333, #555);
    border-top-color: #222;
  }
  .action-bar button.primary {
    background: linear-gradient(#00aa22, #006611);
    color: #fff;
    border-top-color: #00ff41;
  }

  /* === Modal piano roll === */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .modal {
    width: 100%;
    max-width: 500px;
    height: 80vh;
    background: linear-gradient(#2a2a2a, #1a1a1a);
    border: 2px solid #444;
    border-top-color: #888;
    display: flex;
    flex-direction: column;
  }
  .modal .titlebar { flex-shrink: 0; }
  .piano-area {
    flex: 1;
    overflow: auto;
    background: #000;
    position: relative;
  }
  .piano-grid {
    position: relative;
    display: flex;
  }
  .piano-keys {
    width: 30px;
    background: #1a1a1a;
    flex-shrink: 0;
    position: sticky;
    left: 0;
    z-index: 2;
  }
  .pkey {
    height: 14px;
    font-size: 8px;
    color: #666;
    padding-left: 2px;
    border-bottom: 1px solid #000;
    background: #ddd;
    color: #333;
  }
  .pkey.black {
    background: #222;
    color: #666;
  }
  .piano-grid-inner {
    position: relative;
  }
  .prow {
    height: 14px;
    border-bottom: 1px solid #111;
  }
  .prow.black { background: #0a0a0a; }
  .prow.white { background: #151515; }
  .note {
    position: absolute;
    height: 12px;
    background: linear-gradient(#00ff41, #00aa22);
    border: 1px solid #00ff88;
    box-shadow: 0 0 4px #00ff41;
    cursor: pointer;
  }
  .help-text {
    font-size: 10px;
    color: #666;
    padding: 4px 6px;
    text-align: center;
  }
</style>

<body>
<div id="app">
  <div class="winamp" style="margin: 6px 6px 0 6px;">
    <div class="titlebar">
      <span class="logo">◉ MUSICTOOL DAW</span>
      <span class="status" id="status">READY</span>
      <span class="spacer"></span>
      <span class="winamp-btn" title="minimize">_</span>
      <span class="winamp-btn" title="close">×</span>
    </div>
    <div class="lcd">
      <div class="lcd-time" id="lcd-time">00:00.00</div>
      <div class="lcd-info">
        <div><b>BAR</b> <span id="lcd-bar">01:01</span></div>
        <div><b>TRK</b> <span id="lcd-track">--</span></div>
      </div>
    </div>
    <div class="transport">
      <button class="tbtn" id="btn-play" title="Play">▶</button>
      <button class="tbtn" id="btn-stop" title="Stop">■</button>
      <button class="tbtn" id="btn-rew" title="Rewind">⏮</button>
      <button class="tbtn" id="btn-loop" title="Loop">⟲</button>
      <input class="bpm-input" id="inp-bpm" type="number" value="120" min="40" max="240">
      <span style="font-size:10px;color:#666;">BPM</span>
    </div>
  </div>

  <div class="main-area">
    <div class="tracks-panel">
      <div class="header">TRACKS</div>
      <div id="track-list" style="flex:1;overflow-y:auto;"></div>
      <div class="add-btns">
        <button id="btn-add-audio">+A</button>
        <button id="btn-add-midi">+M</button>
      </div>
    </div>
    <div class="timeline-panel" id="timeline-panel">
      <div class="timeline-inner" id="timeline-inner">
        <div class="ruler" id="ruler"></div>
        <div id="lanes"></div>
        <div class="playhead" id="playhead" style="left:0;"></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button id="btn-import">📂 IMPORT</button>
    <button id="btn-save">💾 SAVE</button>
    <button id="btn-load">📁 LOAD</button>
    <button id="btn-export" class="primary">🎵 WAV</button>
  </div>

  <div class="help-text">Toca ▶ para empezar. Doble tap en clip MIDI para editar notas.</div>
</div>

<input type="file" id="file-audio" accept="audio/*" style="display:none;">
<input type="file" id="file-json" accept=".json" style="display:none;">

<script>
"use strict";

/* ============================================================
   MUSICTOOL DAW — Winamp Edition
   Vanilla JavaScript. Sin dependencias. iPhone + Android.
   ============================================================ */

const PALETTE = ['#00ff41','#ff00aa','#00aaff','#ffaa00','#aa00ff','#00ffaa','#ff4444','#ffff00'];
const PPB = 40; // pixels por beat
const LANE_H = 40;
const NUM_BARS = 32;

/* ---------- Estado global ---------- */
const state = {
  bpm: 120,
  playing: false,
  looping: false,
  playheadBeat: 0,
  selectedTrackId: null,
  tracks: [],
};

let uidCounter = 0;
function uid() { return 'id_' + (++uidCounter) + '_' + Date.now().toString(36); }

/* ---------- Motor de audio ---------- */
const engine = {
  ctx: null,
  master: null,
  trackNodes: new Map(),
  sampleBuffers: new Map(),
  scheduledSources: new Set(),
  schedulerId: null,
  nextScheduleBeat: 0,
  startCtxTime: 0,
  startBeat: 0,
  scheduledAudioClips: new Set(),
  scheduledMidiNotes: new Set(),

  ensureCtx() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
    }
  },

  async resume() {
    this.ensureCtx();
    if (this.ctx.state !== 'running') await this.ctx.resume();
  },

  reconcile() {
    if (!this.ctx) return;
    const seen = new Set();
    state.tracks.forEach(t => {
      seen.add(t.id);
      let node = this.trackNodes.get(t.id);
      if (!node) {
        const input = this.ctx.createGain();
        const gain = this.ctx.createGain();
        const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        if (pan) input.connect(gain).connect(pan).connect(this.master);
        else input.connect(gain).connect(this.master);
        node = { input, gain, pan };
        this.trackNodes.set(t.id, node);
      }
      const anySolo = state.tracks.some(x => x.soloed);
      const muted = anySolo ? !t.soloed : t.muted;
      node.gain.gain.value = muted ? 0 : t.volume;
      if (node.pan) node.pan.pan.value = t.pan;
    });
    this.trackNodes.forEach((node, id) => {
      if (!seen.has(id)) {
        try { node.input.disconnect(); node.gain.disconnect(); if (node.pan) node.pan.disconnect(); } catch(e) {}
        this.trackNodes.delete(id);
      }
    });
  },

  beatToSec(b) { return (b / state.bpm) * 60; },
  secToBeat(s) { return (s * state.bpm) / 60; },

  play(fromBeat) {
    if (!this.ctx) return;
    this.startBeat = fromBeat;
    this.startCtxTime = this.ctx.currentTime + 0.05;
    this.nextScheduleBeat = fromBeat;
    this.scheduledAudioClips.clear();
    this.scheduledMidiNotes.clear();
    if (this.schedulerId) clearInterval(this.schedulerId);
    this.schedulerId = setInterval(() => this.tick(), 25);
    this.tick();
  },

  stop() {
    if (this.schedulerId) clearInterval(this.schedulerId);
    this.schedulerId = null;
    this.scheduledSources.forEach(s => { try { s.stop(); } catch(e) {} });
    this.scheduledSources.clear();
    this.scheduledAudioClips.clear();
    this.scheduledMidiNotes.clear();
  },

  currentBeat() {
    if (!this.schedulerId || !this.ctx) return this.startBeat;
    return this.startBeat + this.secToBeat(this.ctx.currentTime - this.startCtxTime);
  },

  tick() {
    if (!this.ctx) return;
    const horizonTime = this.ctx.currentTime + 0.15;
    const horizonBeat = this.startBeat + this.secToBeat(horizonTime - this.startCtxTime);
    state.tracks.forEach(track => {
      const node = this.trackNodes.get(track.id);
      if (!node) return;
      track.clips.forEach(clip => {
        const clipEnd = clip.startBeat + clip.lengthBeats;
        if (clipEnd <= this.nextScheduleBeat) return;
        if (clip.startBeat >= horizonBeat) return;
        if (track.kind === 'audio') this.scheduleAudio(clip, node);
        else this.scheduleMidi(clip, node, horizonBeat);
      });
    });
    this.nextScheduleBeat = horizonBeat;
  },

  scheduleAudio(clip, node) {
    if (this.scheduledAudioClips.has(clip.id)) return;
    const buf = this.sampleBuffers.get(clip.bufferId);
    if (!buf) return;
    this.scheduledAudioClips.add(clip.id);
    const startCtx = this.startCtxTime + this.beatToSec(clip.startBeat - this.startBeat);
    if (startCtx < this.ctx.currentTime - 0.02) return;
    const len = this.beatToSec(clip.lengthBeats);
    const off = this.beatToSec(clip.offsetBeats || 0);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.value = clip.gain || 1;
    src.connect(g).connect(node.input);
    src.start(startCtx, off, len);
    src.stop(startCtx + len + 0.05);
    this.scheduledSources.add(src);
    src.onended = () => this.scheduledSources.delete(src);
  },

  scheduleMidi(clip, node, horizonBeat) {
    clip.notes.forEach(note => {
      const key = clip.id + ':' + note.id;
      if (this.scheduledMidiNotes.has(key)) return;
      const absStart = clip.startBeat + note.startBeat;
      const absEnd = absStart + note.lengthBeats;
      if (absEnd <= this.nextScheduleBeat) return;
      if (absStart >= horizonBeat) return;
      this.scheduledMidiNotes.add(key);
      const when = this.startCtxTime + this.beatToSec(absStart - this.startBeat);
      const dur = this.beatToSec(note.lengthBeats);
      if (when < this.ctx.currentTime - 0.02) return;
      this.playNote(note.pitch, when, dur, note.velocity, node.input);
    });
  },

  playNote(pitch, when, dur, vel, out) {
    const freq = 440 * Math.pow(2, (pitch - 69) / 12);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vel * 0.22, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(out);
    osc.start(when);
    osc.stop(when + dur + 0.05);
    this.scheduledSources.add(osc);
    osc.onended = () => this.scheduledSources.delete(osc);
  }
};

/* ---------- WAV export ---------- */
function encodeWAV(channels, sampleRate) {
  const numCh = channels.length;
  const len = channels[0].length;
  const buffer = new ArrayBuffer(44 + len * numCh * 2);
  const view = new DataView(buffer);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); view.setUint32(4, 36 + len * numCh * 2, true);
  ws(8, 'WAVE'); ws(12, 'fmt '); view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * numCh * 2, true);
  view.setUint16(32, numCh * 2, true); view.setUint16(34, 16, true);
  ws(36, 'data'); view.setUint32(40, len * numCh * 2, true);
  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = Math.max(-1, Math.min(1, channels[c][i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

async function exportWav() {
  const lastBeat = state.tracks.flatMap(t => t.clips.map(c => c.startBeat + c.lengthBeats))
    .reduce((a, b) => Math.max(a, b), 16);
  const sampleRate = 44100;
  const durationSec = (lastBeat / state.bpm) * 60 + 2;
  const frames = Math.ceil(durationSec * sampleRate);
  const offline = new OfflineAudioContext(2, frames, sampleRate);
  const master = offline.createGain();
  master.gain.value = 0.8;
  master.connect(offline.destination);

  const trackNodes = new Map();
  const anySolo = state.tracks.some(t => t.soloed);
  state.tracks.forEach(t => {
    const g = offline.createGain();
    const p = offline.createStereoPanner();
    p.pan.value = t.pan;
    g.gain.value = (anySolo && !t.soloed) || (!anySolo && t.muted) ? 0 : t.volume;
    g.connect(p).connect(master);
    trackNodes.set(t.id, g);
  });

  state.tracks.forEach(track => {
    const out = trackNodes.get(track.id);
    track.clips.forEach(clip => {
      if (track.kind === 'audio' && clip.bufferId) {
        const buf = engine.sampleBuffers.get(clip.bufferId);
        if (!buf) return;
        const src = offline.createBufferSource();
        src.buffer = buf;
        const g = offline.createGain();
        g.gain.value = clip.gain || 1;
        src.connect(g).connect(out);
        src.start((clip.startBeat / state.bpm) * 60, (clip.offsetBeats / state.bpm) * 60, (clip.lengthBeats / state.bpm) * 60);
      } else if (clip.notes) {
        clip.notes.forEach(n => {
          const when = ((clip.startBeat + n.startBeat) / state.bpm) * 60;
          const dur = (n.lengthBeats / state.bpm) * 60;
          const freq = 440 * Math.pow(2, (n.pitch - 69) / 12);
          const osc = offline.createOscillator();
          const g = offline.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0, when);
          g.gain.linearRampToValueAtTime(n.velocity * 0.22, when + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
          osc.connect(g).connect(out);
          osc.start(when);
          osc.stop(when + dur + 0.05);
        });
      }
    });
  });

  const rendered = await offline.startRendering();
  const blob = encodeWAV([rendered.getChannelData(0), rendered.getChannelData(1)], sampleRate);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'musictool-export.wav';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- Render UI ---------- */
function renderTrackList() {
  const container = document.getElementById('track-list');
  container.innerHTML = '';
  state.tracks.forEach(track => {
    const div = document.createElement('div');
    div.className = 'track-item' + (state.selectedTrackId === track.id ? ' selected' : '');
    div.onclick = () => { state.selectedTrackId = track.id; renderTrackList(); renderLanes(); };
    div.innerHTML = `
      <div class="tname" style="color:${track.color}">${track.name}</div>
      <div class="tbtns">
        <button class="mute${track.muted ? ' on' : ''}" data-act="mute">M</button>
        <button class="solo${track.soloed ? ' on' : ''}" data-act="solo">S</button>
      </div>`;
    div.querySelector('[data-act="mute"]').onclick = (e) => {
      e.stopPropagation();
      track.muted = !track.muted;
      engine.reconcile();
      renderTrackList();
    };
    div.querySelector('[data-act="solo"]').onclick = (e) => {
      e.stopPropagation();
      track.soloed = !track.soloed;
      engine.reconcile();
      renderTrackList();
    };
    container.appendChild(div);
  });
}

function renderRuler() {
  const ruler = document.getElementById('ruler');
  ruler.innerHTML = '';
  const totalBeats = NUM_BARS * 4;
  const totalWidth = totalBeats * PPB;
  ruler.style.width = totalWidth + 'px';
  for (let bar = 0; bar < NUM_BARS; bar++) {
    const mark = document.createElement('div');
    mark.className = 'ruler-mark';
    mark.style.left = (bar * 4 * PPB) + 'px';
    mark.textContent = (bar + 1);
    ruler.appendChild(mark);
  }
  ruler.onclick = (e) => {
    const rect = ruler.getBoundingClientRect();
    const beat = (e.clientX - rect.left) / PPB;
    if (beat >= 0) {
      state.playheadBeat = beat;
      document.getElementById('playhead').style.left = (beat * PPB) + 'px';
      updateLCD();
    }
  };
}

function renderLanes() {
  const lanes = document.getElementById('lanes');
  lanes.innerHTML = '';
  const totalWidth = NUM_BARS * 4 * PPB;
  document.getElementById('timeline-inner').style.width = totalWidth + 'px';

  state.tracks.forEach(track => {
    const lane = document.createElement('div');
    lane.className = 'track-lane' + (state.selectedTrackId === track.id ? ' selected' : '');
    lane.style.width = totalWidth + 'px';
    lane.onclick = (e) => {
      if (e.target === lane) {
        state.selectedTrackId = track.id;
        renderTrackList();
        renderLanes();
      }
    };
    track.clips.forEach(clip => {
      const el = document.createElement('div');
      el.className = 'clip' + (track.kind === 'midi' ? ' midi' : '');
      el.style.left = (clip.startBeat * PPB) + 'px';
      el.style.width = Math.max(10, clip.lengthBeats * PPB) + 'px';
      el.textContent = track.kind === 'midi' ? '♪ MIDI' : '🔊 Audio';
      el.onclick = (e) => { e.stopPropagation(); state.selectedTrackId = track.id; };
      el.ondblclick = (e) => {
        e.stopPropagation();
        if (track.kind === 'midi') openPianoRoll(track, clip);
      };
      el.oncontextmenu = (e) => {
        e.preventDefault();
        if (confirm('¿Borrar este clip?')) {
          track.clips = track.clips.filter(c => c.id !== clip.id);
          renderLanes();
        }
      };
      lane.appendChild(el);
    });
    lanes.appendChild(lane);
  });
}

function updateLCD() {
  const beat = state.playheadBeat;
  const bar = Math.floor(beat / 4) + 1;
  const b = Math.floor(beat % 4) + 1;
  const sec = (beat / state.bpm) * 60;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 100);
  document.getElementById('lcd-time').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + String(ms).padStart(2,'0');
  document.getElementById('lcd-bar').textContent =
    String(bar).padStart(2,'0') + ':' + String(b).padStart(2,'0');
  const sel = state.tracks.find(t => t.id === state.selectedTrackId);
  document.getElementById('lcd-track').textContent = sel ? sel.name : '--';
}

/* ---------- Playhead animation ---------- */
let rafId = null;
function startPlayheadLoop() {
  if (rafId) return;
  const loop = () => {
    if (state.playing) {
      state.playheadBeat = engine.currentBeat();
      document.getElementById('playhead').style.left = (state.playheadBeat * PPB) + 'px';
      updateLCD();
    }
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}

/* ---------- Acciones ---------- */
async function togglePlay() {
  await engine.resume();
  if (state.playing) {
    engine.stop();
    state.playing = false;
    document.getElementById('btn-play').classList.remove('active');
    document.getElementById('status').textContent = 'STOPPED';
  } else {
    engine.reconcile();
    engine.play(state.playheadBeat);
    state.playing = true;
    document.getElementById('btn-play').classList.add('active');
    document.getElementById('status').textContent = 'PLAYING';
    startPlayheadLoop();
  }
}

function stopAll() {
  engine.stop();
  state.playing = false;
  state.playheadBeat = 0;
  document.getElementById('playhead').style.left = '0px';
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('status').textContent = 'STOPPED';
  updateLCD();
}

function rewind() {
  state.playheadBeat = 0;
  document.getElementById('playhead').style.left = '0px';
  if (state.playing) {
    engine.stop();
    engine.play(0);
  }
  updateLCD();
}

function addTrack(kind) {
  const color = PALETTE[state.tracks.length % PALETTE.length];
  const track = {
    id: uid(),
    name: (kind === 'midi' ? 'MIDI ' : 'Audio ') + (state.tracks.length + 1),
    kind,
    color,
    volume: 0.85,
    pan: 0,
    muted: false,
    soloed: false,
    clips: [],
  };
  // Añadir un clip inicial vacío para que el usuario pueda interactuar
  if (kind === 'midi') {
    track.clips.push({
      id: uid(),
      startBeat: 0,
      lengthBeats: 8,
      notes: [],
    });
  }
  state.tracks.push(track);
  state.selectedTrackId = track.id;
  engine.reconcile();
  renderTrackList();
  renderLanes();
}

/* ---------- Importar audio ---------- */
async function importAudio(file) {
  await engine.resume();
  const arr = await file.arrayBuffer();
  const buf = await engine.ctx.decodeAudioData(arr);
  const id = uid();
  engine.sampleBuffers.set(id, buf);
  const color = PALETTE[state.tracks.length % PALETTE.length];
  const track = {
    id: uid(),
    name: file.name.replace(/\.[^.]+$/, '').slice(0, 12),
    kind: 'audio',
    color,
    volume: 0.85,
    pan: 0,
    muted: false,
    soloed: false,
    clips: [{
      id: uid(),
      startBeat: 0,
      lengthBeats: (buf.duration / 60) * state.bpm,
      offsetBeats: 0,
      bufferId: id,
      gain: 1,
    }],
  };
  state.tracks.push(track);
  state.selectedTrackId = track.id;
  engine.reconcile();
  renderTrackList();
  renderLanes();
  document.getElementById('status').textContent = 'IMPORTED';
}

/* ---------- Guardar / Cargar proyecto ---------- */
function saveProject() {
  const data = {
    version: 1,
    bpm: state.bpm,
    tracks: state.tracks.map(t => ({
      id: t.id, name: t.name, kind: t.kind, color: t.color,
      volume: t.volume, pan: t.pan, muted: t.muted, soloed: t.soloed,
      clips: t.clips.map(c => {
        if (t.kind === 'audio') {
          return { id: c.id, startBeat: c.startBeat, lengthBeats: c.lengthBeats,
                   offsetBeats: c.offsetBeats, gain: c.gain, note: 'audio-no-buffer' };
        }
        return { id: c.id, startBeat: c.startBeat, lengthBeats: c.lengthBeats, notes: c.notes };
      }),
    })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'musictool-project.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.getElementById('status').textContent = 'SAVED';
}

function loadProject(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      state.bpm = data.bpm || 120;
      state.tracks = data.tracks || [];
      state.selectedTrackId = state.tracks.length ? state.tracks[0].id : null;
      state.playheadBeat = 0;
      document.getElementById('inp-bpm').value = state.bpm;
      engine.reconcile();
      renderTrackList();
      renderLanes();
      updateLCD();
      document.getElementById('status').textContent = 'LOADED';
    } catch (e) {
      alert('Archivo inválido');
    }
  };
  reader.readAsText(file);
}

/* ---------- Piano Roll modal ---------- */
let pianoState = null;

function openPianoRoll(track, clip) {
  pianoState = { track, clip };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'piano-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closePianoRoll(); };

  const modal = document.createElement('div');
  modal.className = 'modal';

  const PH = 14;
  const PMIN = 36;
  const PMAX = 84;
  const NPB = 60;

  modal.innerHTML = `
    <div class="titlebar">
      <span class="logo">♪ PIANO ROLL</span>
      <span class="spacer" style="flex:1"></span>
      <span class="winamp-btn" id="pr-close">×</span>
    </div>
    <div class="help-text">Doble tap en la cuadrícula para añadir nota. Mantén pulsada una nota para borrarla.</div>
    <div class="piano-area" id="piano-area">
      <div class="piano-grid">
        <div class="piano-keys" id="piano-keys"></div>
        <div class="piano-grid-inner" id="piano-grid-inner"></div>
      </div>
    </div>
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const keys = modal.querySelector('#piano-keys');
  const grid = modal.querySelector('#piano-grid-inner');

  for (let i = 0; i < PMAX - PMIN + 1; i++) {
    const pitch = PMAX - i;
    const black = [1,3,6,8,10].includes(pitch % 12);
    const k = document.createElement('div');
    k.className = 'pkey' + (black ? ' black' : '');
    k.textContent = (pitch % 12 === 0) ? 'C' + (Math.floor(pitch/12)-1) : '';
    keys.appendChild(k);

    const row = document.createElement('div');
    row.className = 'prow ' + (black ? 'black' : 'white');
    row.style.width = Math.max(clip.lengthBeats * NPB, 500) + 'px';
    grid.appendChild(row);
  }

  grid.style.position = 'relative';
  grid.style.width = Math.max(clip.lengthBeats * NPB, 500) + 'px';

  function drawNotes() {
    grid.querySelectorAll('.note').forEach(n => n.remove());
    clip.notes.forEach(note => {
      const el = document.createElement('div');
      el.className = 'note';
      el.style.left = (note.startBeat * NPB) + 'px';
      el.style.top = ((PMAX - note.pitch) * PH) + 'px';
      el.style.width = Math.max(8, note.lengthBeats * NPB - 1) + 'px';
      const timer = setTimeout(() => {
        if (confirm('¿Borrar esta nota?')) {
          clip.notes = clip.notes.filter(x => x.id !== note.id);
          drawNotes();
        }
      }, 600);
      el.addEventListener('pointerup', () => clearTimeout(timer));
      el.addEventListener('pointerdown', () => {});
      grid.appendChild(el);
    });
  }
  drawNotes();

  grid.addEventListener('dblclick', (e) => {
    if (e.target.classList.contains('note')) return;
    const rect = grid.getBoundingClientRect();
    const beat = Math.floor((e.clientX - rect.left) / NPB);
    const row = Math.floor((e.clientY - rect.top) / PH);
    const pitch = PMAX - row;
    if (pitch < PMIN || pitch > PMAX) return;
    clip.notes.push({
      id: uid(),
      pitch,
      startBeat: beat,
      lengthBeats: 1,
      velocity: 0.8,
    });
    drawNotes();
  });

  modal.querySelector('#pr-close').onclick = closePianoRoll;
}

function closePianoRoll() {
  const o = document.getElementById('piano-overlay');
  if (o) o.remove();
  pianoState = null;
  renderLanes();
}

/* ---------- Eventos globales ---------- */
document.addEventListener('DOMContentLoaded', () => {
  engine.ensureCtx();
  renderRuler();
  renderTrackList();
  renderLanes();
  updateLCD();
  startPlayheadLoop();

  document.getElementById('btn-play').onclick = togglePlay;
  document.getElementById('btn-stop').onclick = stopAll;
  document.getElementById('btn-rew').onclick = rewind;
  document.getElementById('btn-loop').onclick = (e) => {
    state.looping = !state.looping;
    e.currentTarget.classList.toggle('active');
  };
  document.getElementById('inp-bpm').oninput = (e) => {
    const v = parseInt(e.target.value, 10);
    if (v >= 40 && v <= 240) { state.bpm = v; updateLCD(); }
  };
  document.getElementById('btn-add-audio').onclick = () => addTrack('audio');
  document.getElementById('btn-add-midi').onclick = () => addTrack('midi');
  document.getElementById('btn-import').onclick = () => document.getElementById('file-audio').click();
  document.getElementById('file-audio').onchange = (e) => {
    if (e.target.files[0]) importAudio(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('btn-save').onclick = saveProject;
  document.getElementById('btn-load').onclick = () => document.getElementById('file-json').click();
  document.getElementById('file-json').onchange = (e) => {
    if (e.target.files[0]) loadProject(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('btn-export').onclick = async () => {
    document.getElementById('status').textContent = 'RENDERING...';
    try {
      await exportWav();
      document.getElementById('status').textContent = 'EXPORTED';
    } catch (err) {
      document.getElementById('status').textContent = 'ERROR';
      alert('Error exportando: ' + err.message);
    }
  };

  // Pausa audio al ocultar pestaña (iOS)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.playing) {
      stopAll();
    }
  });
});
</script>
